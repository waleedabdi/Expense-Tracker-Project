<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/main.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Expense Tracker</h1>
      <div class="base-currency">
        <label for="base-currency">Show totals in</label>
        <select id="base-currency">
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="KES">KES</option>
          <option value="NGN">NGN</option>
          <option value="JPY">JPY</option>
        </select>
      </div>
    </header>

    <section class="total" aria-live="polite">
      <p class="total-label">Total spent</p>
      <p class="total-amount" id="total-amount">0.00</p>
      <p class="rate-status" id="rate-status">Loading exchange rates…</p>
    </section>

    <section class="card">
      <h2>Add an expense</h2>
      <form id="expense-form" class="form">
        <div class="field">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="Lunch, bus fare, textbook" required>
        </div>

        <div class="field">
          <label for="amount">Amount</label>
          <input type="number" id="amount" min="0" step="0.01" placeholder="0.00" required>
        </div>

        <div class="field">
          <label for="currency">Currency</label>
          <select id="currency">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="KES">KES</option>
            <option value="NGN">NGN</option>
            <option value="JPY">JPY</option>
          </select>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Study">Study</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button type="submit" class="btn">Add expense</button>
      </form>
      <p class="error" id="form-error" role="alert"></p>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Your expenses</h2>
        <select id="filter-category" aria-label="Filter by category">
          <option value="All">All categories</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Study">Study</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <ul class="expense-list" id="expense-list">
        <!-- JS adds items here. Example of one item:
        <li class="expense">
          <div class="expense-info">
            <span class="expense-name">Lunch</span>
            <span class="expense-meta">Food</span>
          </div>
          <div class="expense-amounts">
            <span class="expense-original">12.00 USD</span>
            <span class="expense-converted">1,550.00 KES</span>
          </div>
          <button class="btn-delete" aria-label="Delete expense">Delete</button>
        </li>
        -->
      </ul>

      <p class="empty" id="empty-message">No expenses yet. Add your first one above.</p>
    </section>
  </main>
</body>
</html>
